<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Log in with TagPro</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* Dark, minimal, centered card - HaxBall-inspired: no chrome beyond what
     the task needs, one accent color, generous spacing over decoration. */
  html, body { margin: 0; padding: 0; min-height: 100%; background: #111; color: #eee; font-family: sans-serif; }
  body { display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; }
  #card { width: 100%; max-width: 380px; background: #181818; border: 1px solid #2a2a2a; border-radius: 10px; padding: 28px; box-sizing: border-box; }
  h1 { font-size: 18px; margin: 0 0 4px; font-weight: normal; }
  .sub { color: #888; font-size: 13px; margin-bottom: 20px; line-height: 1.5; }
  .sub a { color: #5588ff; }
  label { display: block; font-size: 12px; color: #999; margin-bottom: 6px; }
  input[type="text"] { width: 100%; box-sizing: border-box; font-size: 14px; padding: 10px 12px; border-radius: 6px; border: 1px solid #444; background: #1a1a1a; color: #eee; margin-bottom: 12px; }
  button { width: 100%; font-size: 14px; padding: 11px; border: none; border-radius: 6px; cursor: pointer; color: #fff; background: #5588ff; margin-bottom: 8px; }
  button:disabled { opacity: 0.4; cursor: default; }
  button.secondary { background: #333; }
  button.danger { background: #a33; }
  #instructions { font-size: 13px; color: #ddd; background: #1e2436; border: 1px solid #2a3550; border-radius: 6px; padding: 12px; margin-bottom: 12px; line-height: 1.5; }
  #statusText { font-size: 13px; color: #e07a7a; min-height: 16px; margin-bottom: 8px; }
  .name { color: #4caf50; font-size: 16px; margin: 8px 0; text-align: center; }
  .step { display: none; }
  .step.active { display: block; }
  .backLink { display: block; text-align: center; font-size: 13px; color: #888; margin-top: 12px; text-decoration: none; }
  .backLink:hover { color: #5588ff; }
</style>
</head>
<body>
<div id="card">
  <h1>Log in with TagPro</h1>
  <div class="sub">
    Proves you control a real TagPro account by watching you live-change
    its flair - no password, no OAuth. Uses
    <a href="https://tagpro.koalabeast.com/" target="_blank" rel="noopener">tagpro.koalabeast.com</a>'s
    own public profile page.
  </div>

  <div id="statusText"></div>

  <!-- Step 1: already logged in -->
  <div id="stepLoggedIn" class="step">
    <div class="sub">Logged in as</div>
    <div class="name" id="loggedInName"></div>
    <button id="logoutBtn" class="danger">Log out</button>
  </div>

  <!-- Step 2: enter profile -->
  <div id="stepEnter" class="step">
    <label for="profileInput">Your TagPro profile URL or ID</label>
    <input type="text" id="profileInput" placeholder="https://tagpro.koalabeast.com/profile/…" autocomplete="off">
    <button id="startBtn">Start login</button>
  </div>

  <!-- Step 3: follow instructions, confirm when done -->
  <div id="stepPolling" class="step">
    <div id="instructions"></div>
    <button id="confirmBtn">I've done this - Confirm</button>
    <button id="cancelBtn" class="secondary">Cancel</button>
  </div>

  <!-- Step 4: verified -->
  <div id="stepVerified" class="step">
    <div class="sub" style="margin-bottom:0">Verified! You're logged in as</div>
    <div class="name" id="verifiedName"></div>
    <button id="continueBtn">Continue</button>
  </div>

  <a id="backLink" class="backLink" href="index.html">← Back to game</a>
</div>

<!-- The portable drop-in library (see its own header comment) - the rest
     of this page is just this app's specific UI wired on top of it. -->
<script src="local/tagproAuthLib.js"></script>
<script>
// Duplicated rather than imported, same reasoning replays.html already
// documents for WORKER_URL: this page is deliberately standalone, no
// dependency on the game's other scripts. ?server=<url> overrides it for
// local testing without editing this file. Keep in sync with local/
// webrtcTransport.js's WORKER_URL if that ever changes.
var SERVER_URL = new URLSearchParams(location.search).get('server') || 'https://api.bambipro.workers.dev';

// Same-site paths only - otherwise ?return= is just an open redirect for
// anyone who can get a victim to click a crafted login link. Resolved
// through the real URL parser (against this page's own origin) rather than
// a hand-rolled regex on purpose: the URL spec strips things like embedded
// tabs/newlines before resolving, so a naive `raw.indexOf('//') !== 0`-style
// check can be bypassed by a value like "/\t/evil.example" that LOOKS like
// a same-site path in the raw string but the browser still resolves to
// "//evil.example" (a different origin) once it parses it - using the same
// parser here guarantees this check sees exactly what location.href
// assignment below would actually do with it.
function safeReturnPath(raw) {
  if (typeof raw === 'string') {
    try {
      var resolved = new URL(raw, location.origin);
      if (resolved.origin === location.origin) return resolved.pathname + resolved.search + resolved.hash;
    } catch (e) {}
  }
  // No valid return param - land on this same directory's index.html, a
  // sibling of this page. Resolved relative to location.href (not a bare
  // "/") so this works the same whether the site's hosted at a domain
  // root (Cloudflare Pages) or nested under a subpath (a GitHub Pages
  // project page serves this repo at /<repo-name>/, not "/").
  return new URL('index.html', location.href).pathname;
}

var returnTo = safeReturnPath(new URLSearchParams(location.search).get('return'));
document.getElementById('backLink').href = returnTo;

var steps = {
  loggedIn: document.getElementById('stepLoggedIn'),
  enter:    document.getElementById('stepEnter'),
  polling:  document.getElementById('stepPolling'),
  verified: document.getElementById('stepVerified'),
};
var statusText = document.getElementById('statusText');

function showStep(name) {
  Object.keys(steps).forEach(function (key) { steps[key].classList.toggle('active', key === name); });
}

// Set once startLogin() succeeds, cleared on cancel/verify - confirmStep()
// needs both to call checkLogin.
var activeProfileId = null;
var activeSession = null;

function startLogin() {
  var input = document.getElementById('profileInput').value.trim();
  if (!input) { statusText.textContent = 'Paste your profile URL or ID first.'; return; }
  statusText.textContent = '';

  var profileId = TagproAuth.extractProfileId(input);
  TagproAuth.startLogin(SERVER_URL, profileId).then(function (result) {
    activeProfileId = profileId;
    activeSession = result.session;
    showStep('polling');
    document.getElementById('instructions').textContent = result.instructions;
  }).catch(function (err) {
    statusText.textContent = err.message || 'Could not start login.';
  });
}

// One explicit check per "Confirm" click - no background timer. The user
// makes the flair change over on TagPro's own site (a different tab),
// then comes back and clicks Confirm; if the server hasn't seen it yet,
// the instructions text says so ("Still waiting...") and they just try
// again once they've actually made the change.
function confirmStep() {
  var confirmBtn = document.getElementById('confirmBtn');
  confirmBtn.disabled = true;
  statusText.textContent = '';

  TagproAuth.checkLogin(SERVER_URL, activeProfileId, activeSession).then(function (result) {
    confirmBtn.disabled = false;
    document.getElementById('instructions').textContent = result.instructions;
    if (result.state === 'verified') {
      // checkLogin (unlike poll()) doesn't save on its own - see
      // tagproAuthLib.js's own usage comment.
      TagproAuth.saveIdentity({ profileId: result.profileId, reservedName: result.reservedName, verifiedAt: result.verifiedAt, token: result.token });
      // Also seeds the homepage's editable display-name field (local/
      // tagproLogin.js, same 'bambipro_display_name' key, duplicated
      // rather than shared per this page's own standalone-page reasoning
      // above) with the just-verified name - without this, someone who'd
      // already saved some OTHER custom name before ever logging in would
      // land back on the homepage still showing that stale name instead
      // of the identity they just proved ownership of.
      try { localStorage.setItem('bambipro_display_name', result.reservedName); } catch (e) {}
      activeProfileId = null;
      activeSession = null;
      document.getElementById('verifiedName').textContent = result.reservedName;
      showStep('verified');
    }
  }).catch(function (err) {
    confirmBtn.disabled = false;
    statusText.textContent = err.message || 'Could not check - try again.';
  });
}

document.getElementById('startBtn').addEventListener('click', startLogin);
document.getElementById('profileInput').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') startLogin();
});

document.getElementById('confirmBtn').addEventListener('click', confirmStep);

document.getElementById('cancelBtn').addEventListener('click', function () {
  // Tells the server to free this profileId up immediately (best-effort,
  // see cancelLogin's own comment) rather than leaving it locked out for
  // the rest of its TTL - the whole point of "Cancel" is to let you
  // actually start over right away, not just hide the UI while the old
  // attempt keeps blocking a fresh login/start underneath.
  if (activeProfileId && activeSession) {
    TagproAuth.cancelLogin(SERVER_URL, activeProfileId, activeSession);
  }
  activeProfileId = null;
  activeSession = null;
  showStep('enter');
});

document.getElementById('logoutBtn').addEventListener('click', function () {
  TagproAuth.logout();
  showStep('enter');
});

document.getElementById('continueBtn').addEventListener('click', function () {
  location.href = returnTo;
});

var existing = TagproAuth.getIdentity();
if (existing) {
  document.getElementById('loggedInName').textContent = existing.reservedName;
  showStep('loggedIn');
} else {
  showStep('enter');
}
</script>
</body>
</html>
